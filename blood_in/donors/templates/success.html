<!DOCTYPE html>
<html>
<head>
<title>Success</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #ffe5e5, #ffcccc);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;}
    .card {
        background: #ffffff;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        text-align: center;
        width: 350px;
        animation: fadeIn 0.6s ease-in-out;}
    h2 {
        color: #e60023;
        margin-bottom: 20px;}
    .icon {
        font-size: 50px;
        color: #ff4d4d;
        margin-bottom: 10px;}
    .btn {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 25px;
        font-size: 16px;
        color: white;
        background: linear-gradient(135deg, #ff4d4d, #cc0000);
        border: none;
        border-radius: 25px;
        cursor: pointer;
        text-decoration: none;
        transition: 0.3s ease;
        box-shadow: 0 5px 15px rgba(255, 0, 0, 0.3);}
    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(255, 0, 0, 0.4);
        background: linear-gradient(135deg, #ff1a1a, #990000);}
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);}
        to {
            opacity: 1;
            transform: translateY(0);}
    }
</style>
</head>
<body>
<div class="card">
    <div class="icon">🩸</div>
    <h2>Data Submitted Successfully</h2>
    <p>Your information has been saved.</p>
    <a href="/records/" class="btn">View Records</a>
</div>
</body>
</html>
