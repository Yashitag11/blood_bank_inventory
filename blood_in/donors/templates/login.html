<!DOCTYPE html>
<html>
<head>
    <title>Donor Registration</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #e3f2fd, #fce4ec);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 65%;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        h3 {
            margin-top: 25px;
            color: #444;
            border-left: 5px solid #1976d2;
            padding-left: 10px;
        }

        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .field {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
        }

        input, select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: #1976d2;
            outline: none;
            box-shadow: 0px 0px 5px rgba(25,118,210,0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: linear-gradient(to right, #1976d2, #42a5f5);
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(to right, #1565c0, #1e88e5);
            transform: scale(1.02);
        }
    </style>
</head>

<body>

<div class="container">
    
    <h2>Donor Registration</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- PERSONAL INFO -->
        <h3>Personal Information</h3>

        <div class="row">
            <div class="field">
                <label>First Name</label>
                <input type="text" name="first_name" required>
            </div>

            <div class="field">
                <label>Last Name</label>
                <input type="text" name="last_name" required>
            </div>
        </div>

        <div class="row">
            <div class="field">
                <label>Date of Birth</label>
                <input type="date" name="dob" required>
            </div>

            <div class="field">
                <label>Age</label>
                <input type="number" name="age" required>
            </div>
        </div>

        <div class="row">
            <div class="field">
                <label>Blood Group</label>
                <select name="blood_group">
                    <option>A+</option>
                    <option>B+</option>
                    <option>O+</option>
                    <option>AB+</option>
                    <option>A-</option>
                    <option>B-</option>
                    <option>O-</option>
                    <option>AB-</option>
                </select>
            </div>

            <div class="field">
                <label>Phone</label>
                <input type="text" name="phone" required>
            </div>
        </div>

        <div class="row">
            <div class="field">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
        </div>

        <!-- PARENTS INFO -->
        <h3>Parents Information</h3>

        <div class="row">
            <div class="field">
                <label>Father Blood Group</label>
                <select name="blood_group">
                    <option>A+</option>
                    <option>B+</option>
                    <option>O+</option>
                    <option>AB+</option>
                    <option>A-</option>
                    <option>B-</option>
                    <option>O-</option>
                    <option>AB-</option>
                </select>
            </div>

            <div class="field">
                <label>Mother Blood Group</label>
                <select name="mother_blood_group">
                    <option>A+</option>
                    <option>B+</option>
                    <option>O+</option>
                    <option>AB+</option>
                    <option>A-</option>
                    <option>B-</option>
                    <option>O-</option>
                    <option>AB-</option>
                </select>
            </div>
        </div>

        <!-- MEDICAL INFO -->
        <h3>Medical Information</h3>

        <div class="row">
            <div class="field">
                <label>Last Blood Donation</label>
                <input type="date" name="last_donation_date">
            </div>

            <div class="field">
                <label>Any Disease</label>
                <input type="text" name="medical_conditions">
            </div>
        </div>

        <button type="submit">Submit</button>

    </form>
</div>

</body>
</html>
